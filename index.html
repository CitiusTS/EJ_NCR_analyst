<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCR EJ Log Reader Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f0f6ff; --panel:#ffffff; --panel-2:#e7f0fd; --line:#d2e0f3;
    --ink:#10264a; --ink-dim:#46597a; --ink-faint:#7488a6;
    --amber:#1d63d6; --amber-dim:#9cbdf0; --paper:#eef4ff; --paper-ink:#10264a;
    --kritis:#d33a3a; --tinggi:#d9780f; --menengah:#1b8fc9; --normal:#169a68;
    --kritis-bg:rgba(211,58,58,.09); --tinggi-bg:rgba(217,120,15,.10); --menengah-bg:rgba(27,143,201,.10); --normal-bg:rgba(22,154,104,.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  code, .mono{font-family:'IBM Plex Mono',monospace;}
  .app{display:flex;min-height:100vh;}

  /* ---- Sidebar ---- */
  .sidebar{width:220px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .brand{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  .brand .mark{width:30px;height:8px;background:var(--amber);margin-bottom:10px;border-radius:1px;}
  .brand h1{font-size:16px;letter-spacing:.2px;color:var(--ink);}
  .brand p{margin:4px 0 0;font-size:11.5px;color:var(--ink-dim);}
  nav{padding:14px 10px;flex:1;}
  nav button{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:2px;background:none;border:none;border-left:2px solid transparent;color:var(--ink-dim);font-size:13.5px;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;border-radius:0 4px 4px 0;transition:background .12s,color .12s;}
  nav button:hover{background:var(--panel-2);color:var(--ink);}
  nav button.active{background:var(--panel-2);color:var(--amber);border-left-color:var(--amber);font-weight:500;}
  .sidebar-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);}

  /* ---- Main ---- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{padding:16px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .topbar .info{display:flex;gap:22px;flex-wrap:wrap;}
  .info .stat{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;}
  .info .val{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);display:block;margin-top:2px;}
  .content{padding:26px 28px;flex:1;overflow-y:auto;}

  /* ---- Upload ---- */
  .dropzone{max-width:640px;margin:60px auto;padding:48px 32px;border:1.5px dashed var(--line);border-radius:6px;text-align:center;background:var(--panel);cursor:pointer;transition:border-color .15s,background .15s;}
  .dropzone.drag{border-color:var(--amber);background:var(--panel-2);}
  .dropzone h2{font-size:19px;margin-bottom:8px;}
  .dropzone p{color:var(--ink-dim);font-size:13px;line-height:1.6;margin:0 0 18px;}
  .dropzone .btn{display:inline-block;padding:10px 22px;background:var(--amber);color:#fff;font-weight:600;border-radius:4px;font-size:13px;}
  .dropzone input{display:none;}
  .sample-strip{max-width:640px;margin:0 auto;padding:14px 18px;background:var(--panel-2);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);line-height:1.7;}

  /* ---- Cards / grid ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;}
  .card .label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);}
  .card .num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;margin-top:6px;color:var(--ink);}
  .card .sub{font-size:12px;color:var(--ink-dim);margin-top:4px;}
  .card.accent-kritis .num{color:var(--kritis);}
  .card.accent-tinggi .num{color:var(--tinggi);}
  .card.accent-amber .num{color:var(--amber);}

  section.block{margin-bottom:26px;}
  section.block > h3{font-size:14.5px;color:var(--ink);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);}

  .finding{display:flex;gap:12px;padding:13px 16px;border-radius:6px;margin-bottom:8px;border:1px solid var(--line);background:var(--panel);}
  .finding .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .finding .dot.kritis{background:var(--kritis);}
  .finding .dot.tinggi{background:var(--tinggi);}
  .finding .dot.menengah{background:var(--menengah);}
  .finding .dot.normal{background:var(--normal);}
  .finding .body b{color:var(--ink);}
  .finding .body{font-size:13px;color:var(--ink-dim);line-height:1.55;}

  .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;letter-spacing:.2px;}
  .badge.kritis{background:var(--kritis-bg);color:var(--kritis);}
  .badge.tinggi{background:var(--tinggi-bg);color:var(--tinggi);}
  .badge.menengah{background:var(--menengah-bg);color:var(--menengah);}
  .badge.normal{background:var(--normal-bg);color:var(--normal);}
  .badge.dev-e{background:rgba(240,169,78,.15);color:var(--amber);}
  .badge.dev-d{background:rgba(91,155,217,.15);color:var(--menengah);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;padding:8px 10px;color:var(--ink-faint);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink-dim);vertical-align:top;}
  tr:hover td{background:var(--panel-2);}
  td.code{font-family:'IBM Plex Mono',monospace;color:var(--ink);}

  /* ---- Timeline ---- */
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type=text]{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:4px;font-size:13px;font-family:'IBM Plex Sans',sans-serif;}
  .toolbar select{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 10px;border-radius:4px;font-size:13px;}
  .toolbar input:focus,.toolbar select:focus{outline:1px solid var(--amber);}

  .entry{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden;}
  .entry .head{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;}
  .entry .head:hover{background:var(--panel-2);}
  .entry .seq{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);width:46px;flex-shrink:0;}
  .entry .ts{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);width:130px;flex-shrink:0;}
  .entry .tag{font-size:12.5px;color:var(--ink);flex:1;}
  .entry .badges{display:flex;gap:6px;flex-shrink:0;}
  .entry .chev{color:var(--ink-faint);font-size:11px;transition:transform .12s;}
  .entry.open .chev{transform:rotate(90deg);}
  .entry .detail{display:none;padding:0 16px 16px 16px;border-top:1px solid var(--line);}
  .entry.open .detail{display:block;}
  .rawbox{background:#f5f9ff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1c3558;overflow-x:auto;white-space:pre-wrap;line-height:1.6;margin-top:12px;}
  .decode{margin-top:12px;padding:12px 14px;border-radius:4px;border:1px solid var(--line);}
  .decode.kritis{border-color:rgba(224,96,90,.4);background:var(--kritis-bg);}
  .decode.tinggi{border-color:rgba(224,149,78,.4);background:var(--tinggi-bg);}
  .decode.menengah{border-color:rgba(91,155,217,.4);background:var(--menengah-bg);}
  .decode.normal{border-color:rgba(85,176,136,.4);background:var(--normal-bg);}
  .decode .title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .decode .row{font-size:12.5px;color:var(--ink-dim);margin-top:3px;line-height:1.5;}
  .cashtable{margin-top:12px;}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-faint);font-size:13px;}

  .subtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .subtabs button{padding:9px 16px;background:none;border:none;color:var(--ink-dim);font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:'IBM Plex Sans',sans-serif;}
  .subtabs button.active{color:var(--amber);border-bottom-color:var(--amber);}

  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{padding:10px 18px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
  .btn.primary{background:var(--amber);color:#fff;border-color:var(--amber);font-weight:600;}
  .btn:hover{filter:brightness(1.08);}
  .exportcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;max-width:480px;margin-bottom:16px;}
  .exportcard h4{font-size:14px;margin-bottom:6px;}
  .exportcard p{font-size:12.5px;color:var(--ink-dim);margin:0 0 16px;line-height:1.5;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}

  @media(max-width:780px){
    .sidebar{width:64px;}
    .brand p, nav button span.txt{display:none;}
    .brand h1{font-size:0;}
    .brand .mark{margin-bottom:0;}
  }

  .entry .seq{width:76px !important;}
  details.inc{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;}
  details.inc summary{cursor:pointer;padding:12px 16px;list-style:none;}
  details.inc .row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;}
  details.inc .row2{font-size:12.5px;color:var(--ink-dim);line-height:1.55;}
  .kron{border-top:1px solid var(--line);padding:8px 16px 12px;max-height:380px;overflow:auto;}
  .kl{display:flex;gap:14px;font-size:12.5px;padding:3px 0;color:var(--ink-dim);}
  .kl span:first-child{font-family:'IBM Plex Mono',monospace;color:var(--ink-faint);flex:0 0 190px;}
  .kl.er span:last-child{color:var(--kritis);} .kl.ak span:last-child{color:var(--amber);} .kl.ok span:last-child{color:var(--normal);}

  /* ---- Tema terang biru-putih ---- */
  .sidebar{box-shadow:1px 0 8px rgba(29,99,214,.06);}
  .brand .mark{background:linear-gradient(90deg,#1d63d6,#5aa2f5);}
  .card,.entry,details.inc,.exportcard,.finding,.dropzone{box-shadow:0 1px 3px rgba(16,38,74,.06);}
  .badge.dev-e{background:rgba(29,99,214,.12);color:var(--amber);}
  .badge.dev-d{background:rgba(27,143,201,.14);color:var(--menengah);}
  .btn:hover{filter:none;background:var(--panel-2);} .btn.primary:hover{background:#1752b3;}
  .toolbar input[type=text],.toolbar select,.toolbar input[type=number]{background:#fff;}
  tr:hover td{background:#f3f8ff;}
  .topbar{background:#fff;}

  /* ---- Mobile ---- */
  html,body{overflow-x:hidden;}
  @media(max-width:780px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;}
    .brand{padding:8px 12px;border:none;flex-shrink:0;} .brand .mark{display:none;} .brand p{display:none;}
    .brand h1{font-size:13.5px;line-height:1.2;max-width:70px;}
    nav{display:flex;overflow-x:auto;padding:6px 6px 6px 0;gap:4px;flex:1;scrollbar-width:none;} nav::-webkit-scrollbar{display:none;}
    nav button{width:auto;white-space:nowrap;border-left:none;border-bottom:2px solid transparent;border-radius:6px;padding:9px 12px;margin:0;font-size:13px;}
    nav button span.txt{display:inline;}
    nav button.active{border-bottom-color:var(--amber);}
    .sidebar-foot{display:none;}
    .topbar{padding:10px 14px;gap:10px;}
    .topbar .info{gap:8px 16px;} .info .val{font-size:12px;word-break:break-word;}
    .topbar .btn-row{width:100%;} .topbar .btn-row .btn{flex:1;padding:9px 8px;font-size:12.5px;}
    .content{padding:14px;}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important;}
    .grid[style]{grid-template-columns:minmax(0,1fr) !important;}
    .card{padding:12px;} .card .num{font-size:22px;} .card .sub{font-size:11.5px;word-break:break-word;}
    section.block > h3{font-size:13.5px;}
    table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    th,td{padding:7px 8px;font-size:12px;} td{min-width:76px;}
    .entry .head{flex-wrap:wrap;gap:6px 10px;padding:10px 12px;}
    .entry .seq,.entry .ts{width:auto !important;}
    .entry .tag{flex:1 1 100%;order:5;} .entry .badges{flex-wrap:wrap;}
    .entry .detail{padding:0 12px 12px;}
    .rawbox{font-size:11px;padding:10px;}
    details.inc summary{padding:11px 12px;}
    .kron{padding:8px 12px 12px;} .kl{flex-direction:column;gap:0;padding:5px 0;border-bottom:1px solid var(--line);} .kl span:first-child{flex:none;font-size:11.5px;}
    .toolbar{gap:8px;} .toolbar input[type=text]{min-width:0;width:100%;flex:1 1 100%;} .toolbar select{flex:1 1 100%;}
    .toolbar label{flex:1 1 100%;} .toolbar input[type=number]{width:100% !important;}
    .subtabs{overflow-x:auto;} .subtabs button{white-space:nowrap;padding:9px 12px;}
    .dropzone{margin:16px auto;padding:30px 16px;} .sample-strip{font-size:10.5px;overflow-x:auto;}
    .exportcard{max-width:100%;padding:16px;}
    .finding{padding:11px 12px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="mark"></div>
      <h1>EJ Log Reader Pro</h1>
      <p>Multi-log · Insiden · Rekon</p>
    </div>
    <nav id="nav">
      <button data-tab="ringkasan" class="active"><span class="txt">Ringkasan</span></button>
      <button data-tab="insiden"><span class="txt">Analisis Insiden</span></button>
      <button data-tab="rekon"><span class="txt">Rekonsiliasi Kas</span></button>
      <button data-tab="linimasa"><span class="txt">Linimasa</span></button>
      <button data-tab="referensi"><span class="txt">Referensi Kode</span></button>
      <button data-tab="ekspor"><span class="txt">Ekspor</span></button>
    </nav>
    <div class="sidebar-foot">M-status Dispenser (E) &amp; Card Reader (D) dibaca dari kamus terpisah.</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div id="topbar-info" class="info">
        <div class="stat">Belum ada file dimuat</div>
      </div>
      <div class="btn-row" id="topbar-actions" style="display:none;">
        <button class="btn" id="btn-reload">Ganti Semua Log</button>
        <button class="btn primary" id="btn-add">+ Tambah Log</button>
      </div>
    </div>
    <div class="content" id="content">
      <!-- injected -->
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple accept=".txt,.log,.217,.json,*" style="display:none;">

<script>
/* ============================= REFERENCE DATA ============================= */

const DEVICE_NAMES = {
  A:'Time of Day Clock (Jam)', B:'Power Failure (Gangguan Listrik)',
  C:'Card Reader/Writer', D:'Card Reader/Writer (Pembaca Kartu)',
  E:'Currency Dispenser (Mesin Dispense Uang)', F:'Depository (Setor Tunai)',
  G:'Receipt Printer', H:'Journal Printer', I:'Validation Printer',
  J:'Vandal Guard', K:'Night Safe Depository', L:'Encryptor (EPP)',
  M:'Camera', N:'Door Access', O:'Flex Disk', P:'Sensor',
  Q:'Touch Screen', R:'Supervisor Keys', V:'Statement Printer', Y:'Coin Dispenser'
};

// Currency Dispenser (device E) — M-bb dictionary, from Panduan_NCR_ATM_Error_Indonesia.docx §4.2
const DISPENSER_M = {
'00':{p:'normal',part:'—',c:'Tidak ada error – sistem berjalan normal',a:'Tidak diperlukan tindakan'},
'01':{p:'tinggi',part:'Kaset (Cassette)',c:'Pick diminta dari kaset yang tidak terpasang',a:'Pasang kaset yang sesuai; lakukan reset ATM'},
'02':{p:'tinggi',part:'Sensor LVDT/NTS, Kualitas Uang di Kaset',c:'Terlalu banyak uang yang ditolak (reject) – terlalu kecil, ganda, atau gagal belajar parameter',a:'Bersihkan sensor LVDT/NTS; jalankan Learn Bill Parameters; periksa kondisi uang dalam kaset'},
'03':{p:'tinggi',part:'Pick Module (Roller & Sensor Pick)',c:'Pick failure – gagal mengambil uang dari kaset',a:'Bersihkan roller pick dan sensor pick; periksa kondisi kaset'},
'04':{p:'kritis',part:'Pick Module & Kaset (stok kosong/hampir kosong)',c:'Pick failure + kaset hampir kosong atau kosong',a:'ISI ULANG kaset segera; setelah isi ulang lakukan reset ATM'},
'05':{p:'kritis',part:'Sensor Transport (TSEN 1-8), Transport Utama',c:'Sensor gagal ATAU uang macet di transport utama',a:'Buka unit, periksa & bersihkan jalur transport; bersihkan sensor TSEN 1-8'},
'06':{p:'tinggi',part:'Divert Gate (solenoid & sensor gate)',c:'Divert gate failure – posisi awal salah atau gagal bergerak',a:'Periksa mekanisme divert gate; bersihkan sensor gate; uji solenoid gate'},
'07':{p:'kritis',part:'Reject Bin / Purge Bin',c:'Reject bin / Purge bin tidak terpasang – unit INOPERATIVE',a:'Pasang reject bin dengan benar hingga terkunci; lakukan reset'},
'08':{p:'kritis',part:'Reject Bin, Sensor Overfill',c:'Reject bin penuh ATAU sensor overfill tersumbat – unit INOPERATIVE',a:'Kosongkan reject bin; bersihkan sensor overfill; lakukan reset'},
'09':{p:'kritis',part:'Modul Komunikasi Dispenser (kabel/firmware)',c:'Kegagalan komunikasi di dispenser',a:'Periksa kabel komunikasi; lakukan power cycle; periksa firmware'},
'10':{p:'kritis',part:'SOH (State of Health) Dispenser — status sistem, bukan satu komponen fisik; akar masalah ada di modul lain yang gagal FATAL sebelumnya',c:'Operasi tidak dilakukan karena kegagalan FATAL dari operasi sebelumnya',a:'Reset SOH ke HEALTHY melalui supervisor software; identifikasi dan perbaiki root cause'},
'11':{p:'tinggi',part:'Transport (jalur uang tersisa dari operasi sebelumnya)',c:'Uang masih tersusun di transport dari operasi sebelumnya',a:'Lakukan perintah CLEAR atau DIAG_CLEAR; periksa & bersihkan transport'},
'12':{p:'tinggi',part:'Presenter (mekanisme clamp)',c:'Mekanisme clamp presenter macet atau gagal',a:'Bersihkan area clamp; periksa hambatan fisik; uji motor clamp presenter'},
'13':{p:'kritis',part:'Exit Shutter (macet TERBUKA), Motor/Solenoid Shutter',c:'Exit shutter macet dalam posisi TERBUKA',a:'Periksa hambatan fisik pada shutter; uji motor/solenoid shutter; ganti jika rusak'},
'14':{p:'kritis',part:'Exit Shutter (macet TERTUTUP), Sensor Closed Shutter',c:'Exit shutter macet dalam posisi TERTUTUP',a:'Bersihkan rel shutter; periksa sensor closed; ganti unit shutter jika diperlukan'},
'15':{p:'menengah',part:'Sensor Overfill, Transport',c:'Uang terdeteksi melewati sensor overfill',a:'Periksa jalur transport; cek sensor overfill dari kotoran'},
'16':{p:'kritis',part:'Timing Disk & Motor AC Transport Utama',c:'Timing disk transport utama atau motor AC utama gagal',a:'Periksa timing disk (retak/kotor); bersihkan sensor timing; uji & ganti motor AC'},
'17':{p:'tinggi',part:'Exit Sensor',c:'Exit sensor gagal clear atau tersumbat',a:'Bersihkan sensor exit; periksa ada uang tertinggal di slot keluaran'},
'18':{p:'kritis',part:'Presenter Transport, Sensor Presenter',c:'Uang macet di transport presenter ATAU sensor presenter gagal',a:'Buka dan bersihkan presenter transport; cek semua sensor presenter; lakukan CLEAR'},
'19':{p:'tinggi',part:'Exit Sensor, Slot Keluaran',c:'Exit sensor tersumbat – uang mungkin masih di slot keluaran',a:'Periksa dan ambil uang dari slot; bersihkan sensor exit; verifikasi replenishment data'},
'20':{p:'tinggi',part:'Konfigurasi Dispenser (Bill Parameters)',c:'Dispenser tidak dikonfigurasi',a:'Lakukan konfigurasi awal dispenser; jalankan Learn Bill Parameters'},
'21':{p:'kritis',part:'Modul Keamanan (Security)',c:'Security violation – pelanggaran keamanan terdeteksi',a:'HUBUNGI TIM KEAMANAN SEGERA; dokumentasikan kejadian; periksa adanya tamper'},
'22':{p:'kritis',part:'Modul Keamanan (Security Inhibition)',c:'Security inhibition – proteksi keamanan aktif',a:'Verifikasi status keamanan bersama tim security; hubungi NCR Security'},
'25':{p:'normal',part:'Flex Disk',c:'Flex disk authorization tidak diperlukan',a:'Informasi saja; tidak perlu tindakan'},

const PRIORITY_LABEL = {kritis:'Kritis', tinggi:'Tinggi', menengah:'Menengah', normal:'Normal/Info'};

/* ============================= PARSER ============================= */

function cleanText(raw){
  return raw
    .replace(/\x1B(?:\[[0-9]*[A-Za-z]|\([0-9A-Za-z]|[A-Za-z])/g,'')
    .replace(/\r/g,'\n')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}

function decodeR(r){
  if(!r) return null;
  const d = r.padStart(5,'0').split('').map(Number);
  const bin = d[0]===4?{lvl:'kritis',txt:'Reject bin PENUH – segera kosongkan!'}:{lvl:'normal',txt:'Reject bin tidak penuh (normal)'};
  const kasetTxt = v=>({0:'Tidak ada status baru',1:'Stok CUKUP',2:'HAMPIR HABIS – jadwalkan pengisian',3:'HABIS – isi ulang segera!'}[v]||'—');
  const kasetLvl = v=>({0:'normal',1:'normal',2:'tinggi',3:'kritis'}[v]||'normal');
  return {
    bin,
    kaset: [1,2,3,4].map(i=>({no:i, val:d[i], txt:kasetTxt(d[i]), lvl:kasetLvl(d[i])}))
  };
}

function decodeTxnField(device, aaa){
  if(device==='E' && aaa && aaa.length>=1){
    const digit1 = aaa[0];
    const sheets = [aaa.substr(1,2),aaa.substr(3,2),aaa.substr(5,2),aaa.substr(7,2)];
    return {kind:'dispenser', digit1, meaning: TXN_DIGIT1[digit1]||('Kode tidak dikenal: '+digit1), sheets};
  }
  return null;
}

function parseLogBase(raw){
  const clean = cleanText(raw);
  const lines = clean.split('\n');
  const headerRe = /^\*(\d+)\*(\d{2}\/\d{2}\/\d{4})\*(\d{2}:\d{2})\*$/;
  let entries = [];
  let current = null;
  for(const line of lines){
    const trimmed = line.trim();
    const m = headerRe.exec(trimmed);
    if(m){
      current = {seq:m[1], date:m[2], time:m[3], raw:[], events:[]};
      entries.push(current);
    } else if(current && trimmed !== ''){
      current.raw.push(line.replace(/\s+$/,''));
    }
  }

  const statusRe = /\*(\d{1,4})?\*(\d)\*([A-Z])\*([^\n,]*),M-(\d*)(?:,R-(\d+))?/g;
  const cardRe = /MSA\w*\$(\d{14})\$(\w+)\$(\S+)/g;

  entries.forEach(e=>{
    const text = e.raw.join('\n');
    statusRe.lastIndex = 0;
    let sm;
    while((sm = statusRe.exec(text)) !== null){
      const device = sm[3];
      const hasCode = sm[5] !== '';
      const code = hasCode ? sm[5].padStart(2,'0') : null;
      let dict = null;
      if(device==='E') dict = DISPENSER_M;
      else if(device==='D' || device==='C') dict = CARDREADER_M;
      const info = (hasCode && dict) ? dict[code] : null;
      e.events.push({
        type:'status', tttt: sm[1]||null, mtype: sm[2], device,
        deviceName: DEVICE_NAMES[device] || ('Kode perangkat '+device),
        aaa: sm[4], code, r: sm[6]||null, info,
        txn: decodeTxnField(device, sm[4]),
        rInfo: sm[6] ? decodeR(sm[6]) : null
      });
    }
    cardRe.lastIndex = 0;
    let cm;
    while((cm = cardRe.exec(text)) !== null){
      e.events.push({type:'card', ts:cm[1], action:cm[2], pan:cm[3]});
    }
    e.isTxnStart = /TRANSACTION START/.test(text);
    e.isTxnEnd = /TRANSACTION END/.test(text);
    e.isSupervisorEntry = /SUPERVISOR MODE ENTRY/.test(text);
    e.isSupervisorExit = /SUPERVISOR MODE EXIT/.test(text);
    e.isPowerUp = /POWER-UP\/RESET/.test(text);
    e.isCardReaderActivated = /PRIMARY CARD READER ACTIVATED/.test(text);
    e.isCustomerCancelled = /CUSTOMER CANCELLED/.test(text);
    e.isHostTimeout = /HOST TX TIMEOUT/.test(text);
    const initMatches = text.match(/CARD INITIALISE ATTEMPT = \d/g);
    e.cardInitAttempts = initMatches ? initMatches.length : 0;
    const cashM = text.match(/DENOMINATION\s+([\d\s]+)\nDISPENSED\s+([\d\s]+)\nREJECTED\s+([\d\s]+)\nREMAINING\s+([\d\s]+)/);
    if(cashM){
      e.cash = {
        denom: cashM[1].trim().split(/\s+/),
        dispensed: cashM[2].trim().split(/\s+/),
        rejected: cashM[3].trim().split(/\s+/),
        remaining: cashM[4].trim().split(/\s+/),
      };
    }
    // simple classification tag for filtering
    if(e.isTxnStart) e.cls = 'transaksi';
    else if(e.isSupervisorEntry || e.isSupervisorExit) e.cls = 'supervisor';
    else if(e.isPowerUp || e.isCardReaderActivated) e.cls = 'sistem';
    else if(e.events.some(ev=>ev.type==='status')) e.cls = 'status';
    else e.cls = 'lain';
  });

  return entries;
}

function summarize(entries){
  const statusEvents = [];
  entries.forEach(e=>e.events.forEach(ev=>{ if(ev.type==='status') statusEvents.push({...ev, seq:e.seq, date:e.date, time:e.time}); }));
  const dispenserEvents = statusEvents.filter(e=>e.device==='E');
  const cardEvents = statusEvents.filter(e=>e.device==='D'||e.device==='C');
  const otherEvents = statusEvents.filter(e=>!['E','D','C'].includes(e.device));
  const txnCount = entries.filter(e=>e.isTxnStart).length;
  const powerUps = entries.filter(e=>e.isPowerUp);
  const supervisorEntries = entries.filter(e=>e.isSupervisorEntry);
  const cancelled = entries.filter(e=>e.isCustomerCancelled).length;
  const emvFallback = entries.filter(e=>e.cardInitAttempts>=3);

  function groupBy(arr, key){
    const m = {};
    arr.forEach(x=>{ const k = key(x); (m[k] = m[k]||[]).push(x); });
    return m;
  }
  const dispenserByCode = groupBy(dispenserEvents, e=>e.code);
  const cardByCode = groupBy(cardEvents, e=>e.code);

  return {
    entries, statusEvents, dispenserEvents, cardEvents, otherEvents,
    txnCount, powerUps, supervisorEntries, cancelled, emvFallback,
    dispenserByCode, cardByCode,
    dateStart: entries.length ? {date:entries[0].date, time:entries[0].time} : null,
    dateEnd: entries.length ? {date:entries[entries.length-1].date, time:entries[entries.length-1].time} : null,
  };
}

/* ============================= STATE & RENDER ============================= */

let STATE = { entries: [], sum: null, tab: 'ringkasan', filter: 'all', search: '', refTab: 'dispenser' };

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function badgeHTML(p){ return `<span class="badge ${p}">${PRIORITY_LABEL[p]||p}</span>`; }

function loadFile(file){
  const reader = new FileReader();
  reader.onload = function(ev){
    const entries = parseLog(ev.target.result);
    STATE.entries = entries;
    STATE.sum = summarize(entries);
    STATE.fileName = file.name;
    renderTopbar();
    renderTab();
  };
  reader.readAsText(file);
}

function renderTopbar(){
  const info = $('#topbar-info');
  const actions = $('#topbar-actions');
  if(!STATE.sum){
    info.innerHTML = `<div class="stat">Belum ada file dimuat</div>`;
    actions.style.display = 'none';
    return;
  }
  const s = STATE.sum;
  info.innerHTML = `
    <div><div class="stat">File</div><div class="val">${esc(STATE.fileName)}</div></div>
    <div><div class="stat">Periode</div><div class="val">${s.dateStart.date} ${s.dateStart.time} &rarr; ${s.dateEnd.date} ${s.dateEnd.time}</div></div>
    <div><div class="stat">Total Transaksi</div><div class="val">${s.txnCount}</div></div>
    <div><div class="stat">Total Entri Log</div><div class="val">${s.entries.length}</div></div>
  `;
  actions.style.display = 'flex';
}

function renderTab(){
  const c = $('#content');
  if(!STATE.sum){
    c.innerHTML = renderUpload();
    attachUploadHandlers();
    return;
  }
  if(STATE.tab === 'ringkasan') c.innerHTML = renderRingkasan();
  else if(STATE.tab === 'linimasa'){ c.innerHTML = renderLinimasaShell(); renderLinimasaList(); attachLinimasaHandlers(); }
  else if(STATE.tab === 'referensi') { c.innerHTML = renderReferensiShell(); renderReferensiTable(); }
  else if(STATE.tab === 'ekspor') c.innerHTML = renderEkspor();
  else if(STATE.tab === 'insiden') c.innerHTML = renderInsiden();
  else if(STATE.tab === 'rekon'){ c.innerHTML = renderRekon(); attachRekonHandlers(); }
}

function renderUpload(){
  return `
  <div class="dropzone" id="dropzone">
    <h2>Muat Satu atau Beberapa File EJ Log NCR</h2>
    <p>Seret semua file journal log (mis. EJ000151.768 … .776, boleh sekaligus) ke sini, atau klik untuk memilih file.<br>
    Berlaku untuk format EJ APTRA Advance / NDC+, ekstensi apa pun.</p>
    <div class="btn">Pilih File</div>
  </div>
  <div class="sample-strip">
    Contoh baris yang dikenali parser:<br>
    &nbsp;&nbsp;*1263*2*E*400000000,M-10,R-10200 &nbsp;→ Dispenser (E)<br>
    &nbsp;&nbsp;*1271*1*D*9,M-81,R-0 &nbsp;→ Card Reader (D)
  </div>`;
}

function attachUploadHandlers(){
  const dz = $('#dropzone');
  const input = $('#fileInput');
  dz.addEventListener('click', ()=>input.click());
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
  dz.addEventListener('drop', e=>{
    e.preventDefault(); dz.classList.remove('drag');
    if(e.dataTransfer.files.length) loadFiles(e.dataTransfer.files,false);
  });
}

/* ---- Ringkasan ---- */
function renderRingkasan(){
  const s = STATE.sum;
  const dispCritical = s.dispenserEvents.filter(e=>e.info && e.info.p==='kritis').length;
  const cardHigh = s.cardEvents.filter(e=>e.info && (e.info.p==='kritis'||e.info.p==='tinggi')).length;

  let html = `<div class="grid">
    <div class="card"><div class="label">Total Transaksi</div><div class="num">${s.txnCount}</div><div class="sub">${s.entries.length} entri log total</div></div>
    <div class="card accent-amber"><div class="label">Status Dispenser (E)</div><div class="num">${s.dispenserEvents.length}</div><div class="sub">${dispCritical} berprioritas Kritis</div></div>
    <div class="card accent-tinggi"><div class="label">Status Card Reader (D)</div><div class="num">${s.cardEvents.length}</div><div class="sub">${cardHigh} berprioritas Tinggi/Kritis</div></div>
    <div class="card ${s.emvFallback.length ? 'accent-kritis':''}"><div class="label">Gagal Inisialisasi Chip 3x</div><div class="num">${s.emvFallback.length}</div><div class="sub">dari ${s.txnCount} transaksi</div></div>
  </div>`;

  html += `<section class="block"><h3>Temuan Utama</h3>`;

  if(s.dispenserByCode['10'] && s.dispenserByCode['10'].length){
    const arr = s.dispenserByCode['10'];
    const pct = Math.round(arr.length / Math.max(s.txnCount,1) * 100);
    html += `<div class="finding"><div class="dot kritis"></div><div class="body">
      <b>Dispenser stuck di status FATAL (M-10)</b> — muncul ${arr.length}× dari ${s.txnCount} transaksi (${pct}%), berulang sepanjang periode log.
      M-10 bukan menunjuk satu modul fisik — ini adalah <b>status SOH (State of Health)</b> yang "menempel FATAL" akibat kegagalan modul lain yang terjadi sebelumnya, sampai di-reset lewat supervisor software. Kejadian paling awal di log ini sudah M-10 sejak transaksi pertama (#${arr[0].tttt}, ${arr[0].date} ${arr[0].time}) — artinya <b>M-code asli yang pertama kali men-trigger FATAL tidak tercakup di file log ini</b> (terjadi sebelum ${s.dateStart.date} ${s.dateStart.time}). Untuk menemukan modul fisik penyebabnya, tarik EJ log satu hari sebelumnya dan cari kode M- dispenser non-normal (mis. M-03 Pick Module, M-05 Sensor Transport, M-13/14 Exit Shutter, M-16 Timing Disk) yang muncul tepat sebelum M-10 pertama kali tercatat.
    </div></div>`;
  }
  if(s.emvFallback.length){
    html += `<div class="finding"><div class="dot tinggi"></div><div class="body">
      <b>Contact unit smart card bermasalah (M-81)</b> — pada ${s.emvFallback.length} transaksi, inisialisasi chip gagal 3× berturut-turut ("CARD INITIALISE ATTEMPT 1/2/3") sebelum transaksi lanjut lewat jalur lain. Rekomendasi referensi: bersihkan kontak, uji kartu lain, periksa power supply contact unit — prioritas <b>Tinggi</b>.
    </div></div>`;
  }
  const lowStock = Object.values(s.dispenserByCode).flat().map(e=>e.rInfo).filter(Boolean);
  const lowKaset = {};
  lowStock.forEach(r=>r.kaset.forEach(k=>{ if(k.lvl!=='normal') lowKaset[k.no] = k; }));
  if(Object.keys(lowKaset).length){
    const txt = Object.values(lowKaset).map(k=>`Kaset #${k.no}: ${k.txt}`).join('; ');
    html += `<div class="finding"><div class="dot tinggi"></div><div class="body"><b>Status suplai kaset (R-status)</b> — ${esc(txt)}.</div></div>`;
  }
  if(s.powerUps.length){
    html += `<div class="finding"><div class="dot menengah"></div><div class="body"><b>ATM mengalami POWER-UP/RESET</b> sebanyak ${s.powerUps.length}× (contoh: entri #${s.powerUps[0].seq}, ${s.powerUps[0].date} ${s.powerUps[0].time}). Bisa jadi reboot terjadwal atau gangguan listrik — cocokkan dengan log kelistrikan lokasi.</div></div>`;
  }
  if(!s.dispenserByCode['10'] && !s.emvFallback.length){
    html += `<div class="finding"><div class="dot normal"></div><div class="body">Tidak ditemukan pola error dominan pada dispenser maupun card reader di log ini.</div></div>`;
  }
  html += `</section>`;

  html += `<section class="block"><h3>Rekap Kode M-Status per Perangkat</h3><div class="grid" style="grid-template-columns:1fr 1fr;">`;
  html += renderCodeTable('Currency Dispenser (E)', s.dispenserByCode, DISPENSER_M);
  html += renderCodeTable('Card Reader/Writer (D)', s.cardByCode, CARDREADER_M);
  html += `</div></section>`;

  return html;
}

function renderCodeTable(title, byCode, dict){
  const codes = Object.keys(byCode).sort((a,b)=>byCode[b].length-byCode[a].length);
  let rows = codes.map(code=>{
    const info = dict[code];
    return `<tr><td class="code">M-${code}</td><td>${byCode[code].length}×</td><td>${info?badgeHTML(info.p):'—'}</td><td>${info&&info.part?esc(info.part):'—'}</td><td>${info?esc(info.c):'Tidak ada di kamus referensi'}</td></tr>`;
  }).join('');
  if(!codes.length) rows = `<tr><td colspan="5" style="color:var(--ink-faint);">Tidak ada kejadian.</td></tr>`;
  return `<div class="card" style="padding:0;overflow:hidden;">
    <div style="padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;">${title}</div>
    <table><thead><tr><th>Kode</th><th>Jumlah</th><th>Prioritas</th><th>Bagian Bermasalah</th><th>Kondisi</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

/* ---- Linimasa ---- */
function renderLinimasaShell(){
  return `
  <div class="toolbar">
    <input type="text" id="search" placeholder="Cari nomor transaksi, kode M-, teks log..." value="${esc(STATE.search)}">
    <select id="filter">
      <option value="all">Semua Kejadian</option>
      <option value="transaksi">Transaksi</option>
      <option value="status">Ada Kode Status (M-)</option>

      <option value="sistem">Sistem / Power</option>
      <option value="lain">Lainnya</option>
    </select>
  </div>
  <div id="linimasa-list"></div>`;
}

function entryMatchesFilter(e){
  if(STATE.filter !== 'all' && e.cls !== STATE.filter) return false;
  if(STATE.search){
    const q = STATE.search.toLowerCase();
    const hay = (e.seq + ' ' + e.raw.join(' ') + ' ' + e.events.map(ev=>ev.tttt||'').join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function entryLabel(e){
  if(e.isTxnStart) return 'Transaksi dimulai';
  if(e.isSupervisorEntry) return 'Masuk Mode Supervisor';
  if(e.isSupervisorExit) return 'Keluar Mode Supervisor';
  if(e.isPowerUp) return 'POWER-UP / RESET';
  if(e.isCardReaderActivated) return 'Primary Card Reader Activated';
  const statusEv = e.events.find(ev=>ev.type==='status' && ev.code);
  if(statusEv) return `Status ${statusEv.deviceName} — M-${statusEv.code}`;
  if(e.raw.length) return e.raw[0].replace(/^\*+|\*+$/g,'').trim().slice(0,60);
  return 'Entri log';
}

function renderLinimasaList(){
  const list = STATE.entries.filter(entryMatchesFilter);
  const el = $('#linimasa-list');
  if(!list.length){ el.innerHTML = `<div class="empty">Tidak ada entri yang cocok dengan pencarian/filter.</div>`; return; }
  el.innerHTML = list.map(e=>{
    const badges = [];
    e.events.filter(ev=>ev.type==='status' && ev.info).forEach(ev=>{ badges.push(badgeHTML(ev.info.p)); });
    if(e.cardInitAttempts>=3) badges.push(`<span class="badge tinggi">3x gagal chip</span>`);
    return `<div class="entry" data-seq="${e.seq}">
      <div class="head" onclick="toggleEntry('${e.seq}')">
        <div class="seq">#${e.seq}</div>
        <div class="ts">${e.date} ${e.time}</div>
        <div class="tag">${esc(entryLabel(e))}</div>
        <div class="badges">${badges.join('')}</div>
        <div class="chev">&#9656;</div>
      </div>
      <div class="detail" id="detail-${e.seq}"></div>
    </div>`;
  }).join('');
}

function toggleEntry(seq){
  const entryEl = document.querySelector(`.entry[data-seq="${seq}"]`);
  const isOpen = entryEl.classList.contains('open');
  if(isOpen){ entryEl.classList.remove('open'); return; }
  entryEl.classList.add('open');
  const e = STATE.entries.find(x=>x.seq===seq);
  const detailEl = $('#detail-'+seq);
  if(detailEl.innerHTML) return; // already rendered
  let html = '';
  e.events.filter(ev=>ev.type==='status').forEach(ev=>{
    if(ev.info){
      html += `<div class="decode ${ev.info.p}">
        <div class="title">M-${ev.code} · ${esc(ev.deviceName)} ${badgeHTML(ev.info.p)}</div>
        <div class="row"><b>Kondisi:</b> ${esc(ev.info.c)}</div>
        ${ev.info.part ? `<div class="row"><b>Bagian bermasalah:</b> ${esc(ev.info.part)}</div>` : ''}
        <div class="row"><b>Tindakan:</b> ${esc(ev.info.a)}</div>
        ${ev.txn ? `<div class="row"><b>Status transaksi:</b> ${esc(ev.txn.meaning)} <span class="mono">(kaset: ${ev.txn.sheets.join('/')})</span></div>` : ''}
        ${ev.rInfo ? `<div class="row"><b>Status suplai (R-${esc(ev.r)}):</b> ${esc(ev.rInfo.bin.txt)}; ${ev.rInfo.kaset.map(k=>'Kaset#'+k.no+': '+k.txt).join('; ')}</div>` : ''}
      </div>`;
    } else if(ev.code) {
      html += `<div class="decode menengah"><div class="title">M-${ev.code} · ${esc(ev.deviceName)}</div>
        <div class="row">Kode ini tidak ada dalam kamus referensi yang dimuat untuk perangkat ${esc(ev.deviceName)}.</div></div>`;
    }
  });
  if(e.cash){
    html += `<div class="cashtable"><table><thead><tr><th></th><th>Tipe 1</th><th>Tipe 2</th><th>Tipe 3</th><th>Tipe 4</th></tr></thead><tbody>
      <tr><td>Denominasi</td>${e.cash.denom.map(v=>'<td class="code">'+v+'</td>').join('')}</tr>
      <tr><td>Dispensed</td>${e.cash.dispensed.map(v=>'<td class="code">'+v+'</td>').join('')}</tr>
      <tr><td>Rejected</td>${e.cash.rejected.map(v=>'<td class="code">'+v+'</td>').join('')}</tr>
      <tr><td>Remaining</td>${e.cash.remaining.map(v=>'<td class="code">'+v+'</td>').join('')}</tr>
    </tbody></table></div>`;
  }
  html += `<div class="rawbox">${esc(e.raw.join('\n'))}</div>`;
  detailEl.innerHTML = html;
}

function attachLinimasaHandlers(){
  $('#search').addEventListener('input', e=>{ STATE.search = e.target.value; renderLinimasaList(); });
  $('#filter').value = STATE.filter;
  $('#filter').addEventListener('change', e=>{ STATE.filter = e.target.value; renderLinimasaList(); });
}

function toCSVRow(arr){ return arr.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(','); }

function exportStatusCSV(){
  const s = STATE.sum;
  const header = ['No. Transaksi','Tanggal','Jam','Tipe(m)','Perangkat','Nama Perangkat','Kode M-','Prioritas','Bagian Bermasalah','Kondisi','Tindakan','R-Status Mentah','Status Suplai'];
  const rows = [header];
  s.statusEvents.forEach(ev=>{
    const rTxt = ev.rInfo ? (ev.rInfo.bin.txt + '; ' + ev.rInfo.kaset.map(k=>'Kaset#'+k.no+':'+k.txt).join('; ')) : '';
    rows.push([ev.tttt, ev.date, ev.time, ev.mtype==='1'?'Unsolicited':'Solicited', ev.device, ev.deviceName, ev.code?('M-'+ev.code):'', ev.info?PRIORITY_LABEL[ev.info.p]:'', ev.info?(ev.info.part||''):'', ev.info?ev.info.c:'', ev.info?ev.info.a:'', ev.r||'', rTxt]);
  });
  const csv = rows.map(toCSVRow).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (STATE.fileName||'ej_log') + '_status_events.csv';
  a.click();
}

function exportExcel(){
  const s = STATE.sum;
  const wb = XLSX.utils.book_new();

  const ringkasan = [
    ['NCR EJ Log Reader — Ringkasan'],
    ['File', STATE.fileName],
    ['Periode', `${s.dateStart.date} ${s.dateStart.time} - ${s.dateEnd.date} ${s.dateEnd.time}`],
    ['Total Transaksi', s.txnCount],
    ['Total Entri Log', s.entries.length],
    ['Kejadian Status Dispenser (E)', s.dispenserEvents.length],
    ['Kejadian Status Card Reader (D)', s.cardEvents.length],
    ['Transaksi Gagal Inisialisasi Chip 3x', s.emvFallback.length],
    ['POWER-UP/RESET', s.powerUps.length],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ringkasan), 'Ringkasan');

  function eventsSheet(events){
    const header = ['No. Transaksi','Tanggal','Jam','Tipe','Kode M-','Prioritas','Kondisi','Bagian Bermasalah','Tindakan','R-Status'];
    const rows = [header];
    events.forEach(ev=>{
      const rTxt = ev.rInfo ? (ev.rInfo.bin.txt + '; ' + ev.rInfo.kaset.map(k=>'Kaset#'+k.no+':'+k.txt).join('; ')) : '';
      rows.push([ev.tttt, ev.date, ev.time, ev.mtype==='1'?'Unsolicited':'Solicited', ev.code?('M-'+ev.code):'', ev.info?PRIORITY_LABEL[ev.info.p]:'', ev.info?ev.info.c:'', ev.info?(ev.info.part||''):'', ev.info?ev.info.a:'', rTxt]);
    });
    return XLSX.utils.aoa_to_sheet(rows);
  }
  XLSX.utils.book_append_sheet(wb, eventsSheet(s.dispenserEvents), 'Status Dispenser');
  XLSX.utils.book_append_sheet(wb, eventsSheet(s.cardEvents), 'Status Card Reader');

  XLSX.writeFile(wb, (STATE.fileName||'ej_log') + '_laporan.xlsx');
}


/* ============ MULTI-LOG · INSIDEN · REKONSILIASI ============ */
const HOST_RC={'000':'Disetujui','055':'PIN salah','075':'PIN tries habis','051':'Saldo tidak cukup','061':'Melebihi limit tarik','013':'Nominal tidak valid','103':'Dispenser error dilaporkan ke host','008':'Kode host (cek spek switch)','116':'Kode host (cek spek switch)','119':'Kode host (cek spek switch)','076':'Kode host (cek spek switch)'};
const sum=a=>a?a.reduce((x,y)=>x+(+y||0),0):0;
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('id-ID');
const rp=n=>n==null?'—':'Rp '+fmt(n);
Object.assign(STATE,{nominal:100000,opn:{},files:[],rekonFilter:'flag'});
const natKey=n=>{const m=n.match(/(\d+)\D*$/);return m?+m[1]:0;};
function entryDT(e){const[mo,d,y]=e.date.split('/').map(Number),[h,mi]=e.time.split(':').map(Number);return y<2020?null:new Date(y,mo-1,d,h,mi);}
const when=e=>`${e.date} ${e.time}${e.dt?'':' ⚠jam reset'}`;
const T4=/TYPE 1 =\s*(\d+)\s+TYPE 2 =\s*(\d+)\s*\nTYPE 3 =\s*(\d+)\s+TYPE 4 =\s*(\d+)/.source;
const g4=(re,t)=>{const m=re.exec(t);return m?[1,2,3,4].map(i=>+m[i]):null;};

function parseLog(raw){
  const entries=parseLogBase(raw);
  entries.forEach(e=>{
    const t=e.raw.join('\n');let m;
    e.cashAdded=g4(new RegExp('CASH ADDED\\s*\\n'+T4),t);
    if(/CASH COUNTS CLEARED/.test(t)) e.cashCleared={disp:g4(new RegExp('CASH DISPENSED\\s*\\n'+T4),t),rem:g4(new RegExp('CASH REMAINING\\s*\\n'+T4),t)};
    if((m=/(TOP|SECOND|THIRD|FOURTH) CASSETTE (REMOVED|INSERTED)/.exec(t))) e.cassMove=m[1]+' '+m[2];
    if(/DIAGNOSTIC DISPENSE REPORT/.test(t)) e.diag={d:sum(g4(new RegExp('NOTES DISPENSED \\(DELTA\\)\\s*\\n'+T4),t)),r:sum(g4(new RegExp('NOTES REJECTED \\(DELTA\\)\\s*\\n'+T4),t))};
    if((m=/(\d{6}) (\d\d\/\d\d\/\d\d) (\d\d:\d\d:\d\d) EMVN\d+ (\d{6})\s*\n\s*(\S+)\s+([\d,]+\.\d\d)\s+(\d{3})/.exec(t))) e.host={op:m[4],pan:m[5],amt:parseFloat(m[6].replace(/,/g,'')),rc:m[7]};
    e.noArpc=/NO ARPC/.test(t);e.tc=/GENAC 2 : TC/.test(t);
    const c=e.events.find(x=>x.type==='card');e.pan=c?c.pan:(e.host?e.host.pan:'');
  });
  return entries;
}

async function loadFiles(list,append){
  const add=await Promise.all(Array.from(list).map(async f=>({name:f.name,raw:new TextDecoder('latin1').decode(await f.arrayBuffer())})));
  const map=new Map((append?STATE.files:[]).map(f=>[f.name,f]));
  add.forEach(f=>map.set(f.name,f));
  const files=[...map.values()].sort((a,b)=>natKey(a.name)-natKey(b.name)||a.name.localeCompare(b.name));
  const entries=[];
  files.forEach(f=>parseLog(f.raw).forEach(e=>{e.file=f.name;e.seq=f.name.split('.').pop()+'-'+e.seq;entries.push(e);}));
  entries.forEach((e,i)=>{e.g=i;e.dt=entryDT(e);});
  STATE.files=files;STATE.entries=entries;STATE.sum=summarize(entries);STATE.fileName=files.length+' file ('+files.map(f=>f.name.split('.').pop()).join(', ')+')';
  STATE.an=analyze(entries);
  renderTopbar();renderTab();
}

function actOf(e){
  if(e.cashAdded) return 'Isi uang: '+fmt(sum(e.cashAdded))+' lembar';
  if(e.cashCleared) return 'Clear counter kas (dispensed '+fmt(sum(e.cashCleared.disp))+', sisa '+fmt(sum(e.cashCleared.rem))+')';
  if(e.diag) return 'Tes dispense diagnostik: keluar '+e.diag.d+', reject '+e.diag.r;
  if(e.cassMove) return 'Kaset '+e.cassMove;
  if(e.isPowerUp) return 'Power-up / reset mesin';
  if(e.isSupervisorEntry) return 'Masuk mode supervisor';
  if(e.isSupervisorExit) return 'Keluar mode supervisor';
  return null;
}

function analyze(entries){
  let A=analyzeOnce(entries);
  if(!STATE.nomUser){const v=A.txs.filter(t=>t.h&&t.h.rc==='000'&&t.dd>0).map(t=>Math.round(t.h.amt/t.dd)),c={};v.forEach(x=>c[x]=(c[x]||0)+1);
    const m=+Object.keys(c).sort((a,b)=>c[b]-c[a])[0];if(m&&m!==STATE.nominal){STATE.nominal=m;A=analyzeOnce(entries);}}
  return A;
}
function analyzeOnce(entries){
  const nom=STATE.nominal,cycles=[],txs=[];let cyc,prev;
  const open=(e,label,carry)=>{cyc={i:cycles.length,label,startE:e,carry,added:0,fills:[],last:null,closeReport:null,endE:e,txs:[]};cycles.push(cyc);prev=cyc.i?{d:0,r:0}:null;};
  open(entries[0],'Awal data (pengisian sebelum log)',null);
  entries.forEach(e=>{
    if(e.cashCleared){cyc.closeReport=e.cashCleared;open(e,'Setelah clear counter '+when(e),sum(e.cashCleared.rem));}
    if(e.cashAdded){const q=sum(e.cashAdded);cyc.added+=q;cyc.fills.push({e,q});}
    let dd=null,dr=null;
    if(e.cash){
      const cd=sum(e.cash.dispensed),cr=sum(e.cash.rejected),cm=sum(e.cash.remaining);
      if(prev){dd=cd-prev.d;dr=cr-prev.r;if(dd<0||dr<0){dd=dr=null;}}
      prev={d:cd,r:cr};cyc.last={d:cd,r:cr,m:cm};
    }
    cyc.endE=e;
    if(!e.isTxnStart) return;
    const h=e.host,errs=e.events.filter(x=>x.type==='status'&&x.device==='E'&&x.code&&x.code!=='00');
    const wd=(h&&h.op.startsWith('01'))||errs.length||(dd>0);
    if(!wd&&!e.noArpc&&!(h&&h.rc!=='000')) return;
    const t={e,g:e.g,cyc:cyc.i,h,errs,dd,dr,pan:e.pan||'',st:'OK',lv:'normal',amt:h?h.amt:(dr>0?dr*nom:null),risk:0};
    const approved=e.tc||(h&&h.rc==='000');
    if(errs.length&&!dd&&approved&&!(h&&h.rc==='103')){t.st='Dispense gagal M-'+errs[0].code+', host sudah approve → cek reversal';t.lv='kritis';t.risk=t.amt||0;}
    else if(errs.length&&h&&h.rc==='103'){t.st='Dispenser M-'+errs[0].code+', host diberi tahu (103)';t.lv='tinggi';}
    else if(errs.length){t.st='Dispenser error M-'+errs[0].code;t.lv='tinggi';}
    else if(e.noArpc){t.st='Host tidak kirim ARPC (NO ARPC)';t.lv='menengah';}
    else if(h&&h.rc!=='000'){t.st='Ditolak host '+h.rc+': '+(HOST_RC[h.rc]||'?');t.lv=['055','051','061','075','013'].includes(h.rc)?'normal':'menengah';}
    else if(h&&h.rc==='000'&&dd===0){t.st='Host approve tapi 0 lembar keluar';t.lv='kritis';t.risk=h.amt;}
    else if(h&&h.rc==='000'&&dd>0&&h.amt&&![10000,20000,50000,100000].includes(Math.round(h.amt/dd))){t.st='Nominal host '+fmt(h.amt)+' tidak cocok dengan '+dd+' lembar keluar';t.lv='tinggi';}
    else if(!(dd>0)&&!(h&&h.op.startsWith('01'))) return;
    t.ok=t.st==='OK'&&dd>0;txs.push(t);cyc.txs.push(t);
  });
  const txByG={};txs.forEach(t=>txByG[t.g]=t);
  /* insiden */
  const incs={};
  entries.forEach(e=>e.events.forEach(ev=>{
    if(ev.type==='status'&&/^\d\d$/.test(ev.code||'')&&ev.code!=='00'&&['E','D','C'].includes(ev.device)){
      const dev=ev.device==='E'?'E':'D',k=dev+'-'+ev.code;
      (incs[k]=incs[k]||{k,dev,code:ev.code,info:ev.info,list:[]}).list.push(e);
    }}));
  const list=Object.values(incs).map(x=>{
    x.first=x.list[0];x.last=x.list[x.list.length-1];
    x.rec=txs.find(t=>t.g>x.last.g&&(x.dev==='E'?t.ok:(t.h&&!t.errs.length&&t.e.cardInitAttempts<3)));
    x.okAfter=x.rec?txs.filter(t=>t.g>=x.rec.g&&t.ok).length:0;
    x.endG=x.rec?x.rec.g:Math.min(entries.length-1,x.last.g+30);
    x.acts=entries.filter(e=>e.g>=x.first.g&&e.g<=x.endG&&actOf(e));
    x.hours=(x.rec&&x.rec.e.dt&&x.first.dt)?(x.rec.e.dt-x.first.dt)/36e5:null;
    return x;}).sort((a,b)=>b.list.length-a.list.length);
  const days=[],dm={};
  txs.forEach(t=>{const d=t.e.date,k=dm[d]||(dm[d]={d,ok:0,err:0,arpc:0,tolak:0,first:t.e});if(!dm[d])return;
    if(t.ok)k.ok++;else if(t.errs.length)k.err++;else if(t.e.noArpc)k.arpc++;else if(t.st!=='OK')k.tolak++;});
  return{cycles,txs,txByG,incs:list,days:Object.values(dm).sort((a,b)=>a.first.g-b.first.g),badClock:entries.filter(e=>!e.dt).length};
}

/* ---- Tab Insiden ---- */
function renderInsiden(){
  const A=STATE.an,s=STATE.sum;
  const E=A.incs.filter(x=>x.dev==='E').reduce((a,x)=>a+x.list.length,0);
  const open=A.incs.filter(x=>!x.rec).length;
  let h=`<div class="grid">
   <div class="card accent-amber"><div class="label">Jenis Masalah</div><div class="num">${A.incs.length}</div><div class="sub">kombinasi perangkat + kode M</div></div>
   <div class="card accent-kritis"><div class="label">Kejadian Dispenser</div><div class="num">${E}</div><div class="sub">dari ${A.txs.filter(t=>t.ok).length+A.txs.filter(t=>t.errs.length).length} percobaan tarik tunai</div></div>
   <div class="card ${open?'accent-kritis':''}"><div class="label">Belum Terbukti Pulih</div><div class="num">${open}</div><div class="sub">tanpa transaksi sukses sesudah error terakhir</div></div>
   <div class="card accent-tinggi"><div class="label">Entri Jam Tidak Valid</div><div class="num">${A.badClock}</div><div class="sub">${s.powerUps.length} power-up/reset; durasi hanya dihitung dari jam valid</div></div></div>
  <section class="block"><h3>Masalah dari Awal sampai Pengerjaan <span style="font-weight:400;color:var(--ink-faint)">(klik baris untuk kronologi)</span></h3>`;
  if(!A.incs.length) h+='<p style="color:var(--ink-dim)">Tidak ada M-status error pada dispenser/card reader.</p>';
  A.incs.forEach(x=>{
    const p=x.info?x.info.p:'normal';
    h+=`<details class="inc"><summary><div class="row1"><span class="badge dev-${x.dev.toLowerCase()}">${x.dev==='E'?'Dispenser':'Card Reader'} M-${x.code}</span>${badgeHTML(p)}<b>${esc(x.info?x.info.c:'Kode tidak ada di kamus')}</b></div>
     <div class="row2">${x.list.length}× · awal ${when(x.first)} (${esc(x.first.file)}) · terakhir ${when(x.last)} · ${x.acts.length} tindakan tercatat · ${x.rec?`<span style="color:var(--normal)">pulih ${when(x.rec.e)}${x.hours!=null?' ('+x.hours.toFixed(1)+' jam sejak awal)':''}, ${x.okAfter} tarik tunai sukses sesudahnya</span>`:`<span style="color:var(--kritis)">belum terbukti pulih</span>`}</div>
     ${x.info?`<div class="row2">Bagian: ${esc(x.info.part)} · Tindakan standar: ${esc(x.info.a)}</div>`:''}</summary>
     <div class="kron">${kronologi(x).map(l=>`<div class="kl ${l.k}"><span>${esc(l.w)}</span><span>${esc(l.t)}</span></div>`).join('')}</div></details>`;
  });
  h+='</section>';
  h+=`<section class="block"><h3>Tren per Tanggal EJ</h3><table><tr><th>Tanggal EJ</th><th>Tarik tunai sukses</th><th>Error dispenser</th><th>NO ARPC</th><th>Ditolak host</th><th>% error dispenser</th></tr>
   ${A.days.map(d=>{const n=d.ok+d.err;return `<tr><td class="code">${d.d}${d.first.dt?'':' ⚠'}</td><td>${d.ok}</td><td style="color:${d.err?'var(--kritis)':'inherit'}">${d.err}</td><td>${d.arpc}</td><td>${d.tolak}</td><td>${n?Math.round(d.err/n*100)+'%':'—'}</td></tr>`}).join('')}</table></section>`;
  return h;
}
function kronologi(x){
  const A=STATE.an,out=[];
  STATE.entries.filter(e=>e.g>=x.first.g&&e.g<=x.endG).forEach(e=>{
    e.events.forEach(ev=>{if(ev.type==='status'&&/^\d\d$/.test(ev.code||'')&&ev.code!=='00'&&ev.device===(x.dev==='E'?'E':ev.device)&&['E','D','C'].includes(ev.device)){
      out.push({k:'er',w:when(e),t:`${ev.deviceName.split(' (')[0]} M-${ev.code}: ${ev.info?ev.info.c:'?'}`+(A.txByG[e.g]?` [${A.txByG[e.g].st}]`:'')});}});
    const a=actOf(e);if(a) out.push({k:'ak',w:when(e),t:'🔧 '+a});
    if(x.rec&&e.g===x.rec.g) out.push({k:'ok',w:when(e),t:'✔ Tarik tunai/transaksi sukses pertama setelah error terakhir'});
  });
  return out.slice(0,200);
}

/* ---- Tab Rekonsiliasi ---- */
function cyCalc(c){
  const L=c.last||{d:0,r:0,m:0},derived=L.m+L.d,awal=c.fills.length?c.added:(c.carry!=null?c.carry:derived);
  const exp=awal-L.d-L.r;
  return{awal,derived,disp:L.d,rej:L.r,exp,rem:L.m,diff:L.m-exp,inconsistent:derived!==awal,
    risk:c.txs.reduce((a,t)=>a+(t.risk||0),0),flag:c.txs.filter(t=>t.lv==='kritis').length,hasData:!!c.last};
}
function renderRekon(){
  const A=STATE.an,nom=STATE.nominal;
  let h=`<section class="block"><h3>Parameter</h3><div class="toolbar"><label style="color:var(--ink-dim)">Nominal per lembar (Rp)</label><input type="number" id="nomInput" value="${nom}" style="width:140px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px;border-radius:4px"><span style="color:var(--ink-faint);font-size:12px">Terdeteksi otomatis dari transaksi sukses (nominal host ÷ lembar). Ubah bila berbeda; isi opname fisik di tiap siklus.</span></div></section>`;
  A.cycles.forEach((c,i)=>{
    const k=cyCalc(c);if(!k.hasData&&!c.fills.length) return;
    const o=STATE.opn[i]||{};
    h+=`<section class="block"><h3>Siklus ${i+1}: ${esc(c.label)} → ${c.endE?when(c.endE):'-'}</h3>
    <div class="grid">
     <div class="card"><div class="label">Awal pengisian</div><div class="num">${fmt(k.awal)}</div><div class="sub">${c.fills.length?'dari log CASH ADDED ('+c.fills.map(f=>when(f.e)).join(', ')+')':'sisa sebelumnya / diturunkan dari counter (sisa+keluar)'} · ${rp(k.awal*nom)}</div></div>
     <div class="card accent-amber"><div class="label">Keluar (dispensed)</div><div class="num">${fmt(k.disp)}</div><div class="sub">${rp(k.disp*nom)}</div></div>
     <div class="card accent-tinggi"><div class="label">Reject</div><div class="num">${fmt(k.rej)}</div><div class="sub">${rp(k.rej*nom)} masuk reject bin</div></div>
     <div class="card"><div class="label">Sisa seharusnya</div><div class="num">${fmt(k.exp)}</div><div class="sub">counter mesin: ${fmt(k.rem)} · selisih ${fmt(k.diff)}${k.diff===k.rej&&k.rej?' (= jumlah reject: counter SISA tidak mengurangi lembar reject)':''}</div></div></div>
    ${k.inconsistent?`<div class="finding"><div class="dot tinggi"></div><div class="body">Counter (sisa+keluar = <b>${fmt(k.derived)}</b>) tidak sama dengan awal (${fmt(k.awal)}). Cek kaset/counter saat pengisian.</div></div>`:''}
    ${c.closeReport?`<div class="finding"><div class="dot menengah"></div><div class="body">Laporan mesin saat clear: keluar <b>${fmt(sum(c.closeReport.disp))}</b>, sisa <b>${fmt(sum(c.closeReport.rem))}</b> lembar (${rp(sum(c.closeReport.disp)*nom)} keluar).</div></div>`:''}
    <div class="finding"><div class="dot ${k.flag?'kritis':'normal'}"></div><div class="body"><b>${k.flag}</b> transaksi perlu rekon ke host (approve tanpa uang keluar / selisih) · perkiraan nominal berisiko <b>${rp(k.risk)}</b></div></div>
    <div class="toolbar" style="flex-wrap:wrap"><b style="color:var(--ink)">Opname fisik:</b>
     <label style="color:var(--ink-dim)">Lembar di kaset</label><input type="number" id="ok-${i}" value="${o.k??''}" oninput="opn(${i})" style="width:110px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px;border-radius:4px">
     <label style="color:var(--ink-dim)">Lembar di reject bin</label><input type="number" id="or-${i}" value="${o.r??''}" oninput="opn(${i})" style="width:110px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px;border-radius:4px"></div>
    <div id="opr-${i}" style="margin-top:8px"></div></section>`;
  });
  h+=`<section class="block"><h3>Daftar Transaksi untuk Rekon</h3><div class="toolbar"><select id="rkF" style="background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px;border-radius:4px"><option value="flag">Perlu rekon (kritis/tinggi)</option><option value="fail">Semua yang gagal</option><option value="all">Semua tarik tunai</option></select></div><div id="rkTbl"></div></section>`;
  return h;
}
function rekonRows(){
  const f=STATE.rekonFilter,T=STATE.an.txs;
  return T.filter(t=>f==='all'||(f==='fail'&&!t.ok)||(f==='flag'&&(t.lv==='kritis'||t.lv==='tinggi')));
}
function renderRkTbl(){
  const R=rekonRows();
  $('#rkTbl').innerHTML=`<p style="color:var(--ink-dim);font-size:12px">${R.length} baris. Nominal host kosong = tidak ada record ke host; perkiraan dari jumlah lembar yang di-reject × nominal.</p><table><tr><th>Waktu EJ</th><th>File</th><th>Kartu</th><th>Nominal host</th><th>Keluar</th><th>Reject</th><th>Status</th></tr>
  ${R.map(t=>`<tr><td class="code">${when(t.e)}</td><td>${esc(t.e.file.split('.').pop())}</td><td class="code">${esc(t.pan.replace(/\*/g,'X'))}</td><td>${t.h?rp(t.h.amt):'—<br><small>≈ '+rp(t.amt)+'</small>'}</td><td>${t.dd==null?'—':t.dd}</td><td>${t.dr==null?'—':t.dr}</td><td>${badgeHTML(t.lv)} ${esc(t.st)}</td></tr>`).join('')}</table>`;
}
function opn(i){
  const c=STATE.an.cycles[i],k=cyCalc(c),nom=STATE.nominal;
  const a=$('#ok-'+i).value,b=$('#or-'+i).value;STATE.opn[i]={k:a===''?undefined:+a,r:b===''?undefined:+b};
  const cl=(v,d,l)=>`<span style="color:${v===0?'var(--normal)':'var(--kritis)'}">${l}: fisik ${fmt(d.f)} vs sistem ${fmt(d.s)} → selisih <b>${v>0?'+':''}${fmt(v)}</b> lembar (${rp(v*nom)})${v===0?' ✔ cocok':''}</span>`;
  let o=[];if(a!=='') o.push(cl(+a-k.exp,{f:+a,s:k.exp},'Kaset'));
  if(b!=='') o.push(cl(+b-k.rej,{f:+b,s:k.rej},'Reject bin'));
  $('#opr-'+i).innerHTML=o.join('<br>');
}
function attachRekonHandlers(){
  $('#nomInput').addEventListener('change',e=>{STATE.nominal=+e.target.value||50000;STATE.nomUser=true;STATE.an=analyze(STATE.entries);renderTab();});
  $('#rkF').value=STATE.rekonFilter;$('#rkF').addEventListener('change',e=>{STATE.rekonFilter=e.target.value;renderRkTbl();});
  renderRkTbl();STATE.an.cycles.forEach((c,i)=>{if($('#ok-'+i)&&(STATE.opn[i]))opn(i);});
}

function exportRekon(){
  const A=STATE.an,nom=STATE.nominal,wb=XLSX.utils.book_new();
  const cyc=[['Siklus','Periode awal','Periode akhir','Awal (lembar)','Keluar','Reject','Sisa seharusnya','Sisa counter','Selisih counter','Opname kaset','Selisih kaset','Opname reject bin','Selisih reject','Tx perlu rekon','Rp berisiko']];
  A.cycles.forEach((c,i)=>{const k=cyCalc(c);if(!k.hasData&&!c.fills.length)return;const o=STATE.opn[i]||{};
    cyc.push([i+1,when(c.startE),when(c.endE),k.awal,k.disp,k.rej,k.exp,k.rem,k.diff,o.k??'',o.k!=null?o.k-k.exp:'',o.r??'',o.r!=null?o.r-k.rej:'',k.flag,k.risk]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cyc),'Siklus Kas');
  const tx=[['Waktu EJ','File','Kartu','Nominal host','Estimasi nominal','Lembar keluar','Lembar reject','Kode host','Status','Level']];
  A.txs.filter(t=>!t.ok).forEach(t=>tx.push([when(t.e),t.e.file,t.pan,t.h?t.h.amt:'',t.amt??'',t.dd??'',t.dr??'',t.h?t.h.rc:'',t.st,t.lv]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tx),'Transaksi Gagal');
  const inc=[['Perangkat','Kode M','Arti','Bagian','Jumlah','Awal','Terakhir','Tindakan tercatat','Pulih sejak','Tarik tunai sukses sesudahnya']];
  A.incs.forEach(x=>inc.push([x.dev==='E'?'Dispenser':'Card Reader','M-'+x.code,x.info?x.info.c:'',x.info?x.info.part:'',x.list.length,when(x.first),when(x.last),x.acts.length,x.rec?when(x.rec.e):'belum pulih',x.okAfter]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(inc),'Insiden');
  XLSX.writeFile(wb,'rekon_ej_ncr.xlsx');
}

/* ============================= INIT ============================= */

$$('#nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    $$('#nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    STATE.tab = btn.dataset.tab;
    renderTab();
  });
});

$('#fileInput').addEventListener('change', e=>{ if(e.target.files.length) loadFiles(e.target.files,STATE.append); STATE.append=false; e.target.value=''; });
$('#btn-reload').addEventListener('click', ()=>{STATE.append=false;$('#fileInput').click();});
$('#btn-add').addEventListener('click', ()=>{STATE.append=true;$('#fileInput').click();});

renderTab();
</script>
</body>
